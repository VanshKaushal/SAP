_schema-version: '3.1'
ID: sap-cognitive-workflow-orchestra
version: 1.0.0
description: "SAP Cognitive Workflow Orchestra - Hybrid React/CAP/OpenUI5 App"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --production
        - npx -p @sap/cds-dk cds build --production

modules:
  - name: sap-orchestra-srv
    type: nodejs
    path: sap-cap
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: sap-orchestra-ui5-approval
    type: html5
    path: ui5-approval-center
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  - name: sap-orchestra-ui5-users
    type: html5
    path: ui5-user-management
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  - name: sap-orchestra-react
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
